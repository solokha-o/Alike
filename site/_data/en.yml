privacy:
  title: Privacy is the whole point
  subtitle: "Photo cleanup means handing an app your most personal library. Alike is built so that it never has to leave your hands."
  image_alt: "The mascot resting beside a tidy, finished photo library."
  claims:
    - title: Analysis runs on your device
      body: "Apple's Vision framework compares your photos locally. There is no Alike server to send anything to."
    - title: Photos are never uploaded
      body: "No photo, thumbnail, or feature print ever leaves your device."
    - title: No analytics, no tracking
      body: "No usage events, no advertising identifiers, no crash reporting SDK, no cookies. The app makes no network requests of its own."
    - title: Deletion is always your call
      body: "Every cleanup needs your confirmation, iOS asks a second time, and the photos land in Recently Deleted."
  cta: Read the full Privacy Policy

