hero:
  eyebrow: iPhone
  headline: "Ваша медіатека — без майже однакових знімків."
  subhead: "Alike групує фотографії, які виглядають схоже, обирає найкращий знімок у кожній групі й допомагає прибрати решту — і жодне фото не залишає ваш пристрій."
  badge: Незабаром в App Store
  badge_note: "Безкоштовне завантаження, з необовʼязковою підпискою Pro."
  trust: "Без облікового запису. Без сервера. Нічого не завантажується в інтернет."
  image_alt: "Маскот Alike — фіолетовий персонаж із лупою над двома фотографіями."

steps:
  title: Як це працює
  subtitle: "Три кроки, і на кожному все вирішуєте ви."
  items:
    - title: Сканування
      body: "Alike порівнює вашу медіатеку за допомогою фреймворку Apple Vision повністю на вашому пристрої. Порівнюються знімки, близькі за часом і місцем; знімки екрана не враховуються, якщо ви не попросите."
      image: step-scan
      image_alt: "Маскот шукає серед фотографій за допомогою лупи."
    - title: Перегляд
      body: "Кожна група відкривається з уже обраним найкращим знімком, тож рішення займає секунди. Залиште лише найкраще, оберіть усе крім найкращого або позначте вручну."
      image: step-review
      image_alt: "Маскот радіє поруч із виділеним найкращим фото."
    - title: Прибирання
      body: "Підтвердьте — і обрані фотографії потраплять до «Нещодавно видалених», де iOS зберігає їх близько 30 днів. Нічого не видаляється без вашої згоди."
      image: step-clean
      image_alt: "Маскот тішиться поруч із упорядкованою медіатекою."

features:
  title: Що ви отримуєте
  items:
    - title: Аналіз на пристрої
      body: "Кожне порівняння виконує фреймворк Apple Vision локально. Без завантаження в інтернет, без черги, без хмарної обробки."
    - title: Три рівні чутливості
      body: "Низький, середній або високий. Підвищуйте поріг, коли потрібні лише майже ідентичні знімки, або знижуйте, щоб знайти більше."
    - title: Найкращий знімок
      body: "Передбачуваний вибір найсильнішого фото в кожній групі, тож завжди є розумний варіант, який варто залишити."
    - title: Покроковий перегляд
      body: "Працюйте з однією групою за раз: «Залишити лише найкраще», «Обрати все крім найкращого» та «Очистити вибір»."
    - title: Позначки перегляду
      body: "«Нове», «У перегляді», «Переглянуто» та «Потребує перегляду» після повторного сканування. Ви завжди знаєте, де зупинилися."
    - title: Прогрес і економія місця
      body: "«Переглянуто», «Залишилось», «Обрано» та «Орієнтовна економія», а також історія прибирання за місяцями."
    - title: Макет під ваш стиль
      body: "Адаптивна сітка перемикається між просторим одним стовпцем і щільнішим макетом, і запамʼятовується між запусками."
    - title: Дві мови, темна тема
      body: "Повна підтримка англійської та української, а також повноцінна темна тема."

