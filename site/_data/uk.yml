faq:
  title: Часті питання
  items:
    - q: Чи завантажує Alike мої фотографії кудись?
      a: "Ні. Усе порівняння відбувається на вашому пристрої за допомогою фреймворку Apple Vision, і застосунок не робить власних мережевих запитів. Єдина зовнішня активність здійснюється Apple, коли ви купуєте або відновлюєте підписку."
    - q: Чи може Alike видалити фото без запиту?
      a: "Ніколи. Ви обираєте, що прибрати, Alike просить підтвердження, а iOS показує власне підтвердження перед видаленням. Видалені фотографії потрапляють до «Нещодавно видалених», де iOS зберігає їх близько 30 днів."
    - q: Чи потрібен обліковий запис?
      a: "Ні. Alike не має облікового запису, входу в систему та сервера. Ви відкриваєте застосунок і починаєте сканування."
    - q: До чого саме Alike отримує доступ?
      a: "До вашої медіатеки — запит надходить один раз на початку. Ви можете надати повний доступ або обмежений і самі обрати, які фото бачитиме Alike, і змінити це будь-коли в Налаштуваннях iOS. Дозвіл на сповіщення запитується лише якщо ви вмикаєте щотижневе нагадування."
    - q: Як визначається, що фотографії схожі?
      a: "Кожне фото отримує числовий відбиток ознак від фреймворку Vision. Порівнюються знімки, близькі за часом і місцем зйомки, і фото приєднується до групи, лише якщо воно схоже на всі фото в ній. Рівень чутливості визначає, наскільки близько це «достатньо близько»."
    - q: Що таке «найкращий знімок»?
      a: "Передбачуваний вибір найсильнішого фото в кожній групі, тож завжди є розумний варіант, який варто залишити. Ви завжди можете змінити цей вибір."
    - q: Як скасувати підписку?
      a: "У Налаштуваннях iOS торкніться свого імені, потім «Підписки». Скасування припиняє майбутні поновлення, а доступ зберігається до кінця оплаченого періоду. Підписками та поверненням коштів опікується Apple, а не ми."
    - q: Чи можу я стерти все, що зберігає Alike?
      a: "Так. Налаштування → «Дані та конфіденційність» → «Видалити дані Alike». Це стирає результати сканування, історію прибирання та налаштування, і не торкається ваших фотографій, доступу до фото та підписки."

support:
  title: Підтримка
  subtitle: "Без облікових записів і систем тікетів. Напишіть листа — і отримаєте відповідь."
  contact_title: Звʼязатися з нами
  contact_body: "Електронна пошта — найшвидший спосіб. Вкажіть версію iOS, ваш пристрій і що ви очікували побачити."
  response: "Відповідь зазвичай надходить протягом кількох днів."
  before_title: Перш ніж писати
  before_body: "Вбудований посібник охоплює більшість питань. Відкрийте Alike, перейдіть у Налаштування, потім «Як користуватися»."
  bug_title: Повідомити про помилку
  bug_body: "Опишіть, що ви робили, чого очікували та що сталося натомість. Не надсилайте фотографії зі своєї медіатеки — вони нам не потрібні, і ми воліли б їх не отримувати."
  privacy_title: Питання щодо конфіденційності
  privacy_body: "Alike не має сервера й нічого не збирає, тож немає даних облікового запису, які можна експортувати чи видалити. Політика конфіденційності пояснює це повністю, а «Видалити дані Alike» в Налаштуваннях стирає все, що зберігається на вашому пристрої."

