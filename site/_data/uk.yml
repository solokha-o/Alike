  title: Конфіденційність — це суть
  subtitle: "Прибирання фотографій означає довірити застосунку найособистішу медіатеку. Alike створений так, щоб вона ніколи не залишала ваші руки."
  image_alt: "Маскот відпочиває поруч з упорядкованою медіатекою."
  claims:
    - title: Аналіз відбувається на вашому пристрої
      body: "Фреймворк Apple Vision порівнює фотографії локально. Сервера Alike, куди можна було б щось надіслати, не існує."
    - title: Фотографії ніколи не завантажуються
      body: "Жодне фото, ескіз чи відбиток ознак не залишає ваш пристрій."
    - title: Без аналітики та відстеження
      body: "Без подій використання, рекламних ідентифікаторів, збору звітів про збої та файлів cookie. Застосунок не робить власних мережевих запитів."
    - title: Видалення — завжди ваше рішення
      body: "Кожне прибирання потребує вашого підтвердження, iOS запитує вдруге, і фотографії потрапляють до «Нещодавно видалених»."
  cta: Читати повну Політику конфіденційності

