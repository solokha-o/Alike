hero:
  eyebrow: iPhone
  headline: "Your camera roll, minus the near-duplicates."
  subhead: "Alike groups the photos that look alike, picks the best shot in each group, and helps you clear the rest — without a single photo leaving your device."
  badge: Coming to the App Store
  badge_note: "Free to download, with an optional Pro subscription."
  trust: "No account. No server. Nothing is uploaded."
  image_alt: "The Alike mascot, a purple character holding a magnifying glass over two photos."

steps:
  title: How it works
  subtitle: "Three steps, and you keep control at every one of them."
  items:
    - title: Scan
      body: "Alike compares your library with Apple's Vision framework, running entirely on your device. Photos close in time and place are compared; screenshots are left out unless you ask for them."
      image: step-scan
      image_alt: "The mascot searching through photos with a magnifying glass."
    - title: Review
      body: "Each group opens with a Best Shot already picked, so you can decide in seconds. Keep Best Only, Select All Except Best, or choose by hand."
      image: step-review
      image_alt: "The mascot celebrating next to a highlighted best photo."
    - title: Clear
      body: "Confirm, and the photos you chose go to Recently Deleted, where iOS keeps them for about 30 days. Nothing is ever removed without you saying so."
      image: step-clean
      image_alt: "The mascot cheering beside a tidied photo library."

features:
  title: What you get
  items:
    - title: On-device analysis
      body: "Every comparison uses Apple's Vision framework, locally. There is no upload, no queue, and no cloud processing."
    - title: Three sensitivity levels
      body: "Low, Medium, or High. Tighten the threshold when you only want near-identical shots, loosen it to catch more."
    - title: Best Shot detection
      body: "A deterministic pick of the strongest photo in each group, so there is always a sensible default to keep."
    - title: Guided review
      body: "Work through one group at a time with Keep Best Only, Select All Except Best, and Clear Selection."
    - title: Review badges
      body: "New, In review, Reviewed, and Needs review after a rescan. You always know where you stopped."
    - title: Progress and savings
      body: "Reviewed, Remaining, Selected, and Estimated Savings, plus a cleanup history grouped by month."
    - title: A layout that fits you
      body: "An adaptive grid that switches between a roomy single column and a denser layout, remembered between launches."
    - title: Two languages, Dark Mode
      body: "Full English and Ukrainian throughout, and complete Dark Mode support."

