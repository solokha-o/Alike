faq:
  title: Common questions
  items:
    - q: Does Alike upload my photos anywhere?
      a: "No. All comparison happens on your device using Apple's Vision framework, and the app makes no network requests of its own. The only outbound activity is handled by Apple when you buy or restore a subscription."
    - q: Will Alike delete photos without asking?
      a: "Never. You select what to remove, Alike asks you to confirm, and iOS shows its own confirmation before anything is deleted. Deleted photos go to Recently Deleted, where iOS keeps them for about 30 days."
    - q: Do I need an account?
      a: "No. Alike has no account, no sign-in, and no server. You open the app and start scanning."
    - q: What does Alike actually access?
      a: "Your photo library, requested once at the start. You can grant full access or limited access and pick which photos Alike may see, and change it any time in iOS Settings. Notification permission is only requested if you turn on the weekly cleanup reminder."
    - q: How does it decide which photos are similar?
      a: "Each photo gets a numeric feature print from the Vision framework. Photos close in capture time and location are compared, and a photo only joins a group if it is similar to every photo already in it. The sensitivity level sets how close is close enough."
    - q: What is Best Shot?
      a: "A deterministic pick of the strongest photo in each group, so there is always a sensible default to keep. You can always override it."
    - q: How do I cancel a subscription?
      a: "In iOS Settings, tap your name, then Subscriptions. Cancelling stops future renewals and you keep access until the paid period ends. Subscriptions and refunds are handled by Apple, not by us."
    - q: Can I erase everything Alike has stored?
      a: "Yes. Settings, then Data & Privacy, then Delete Alike Data. It erases scan results, cleanup history, and preferences, and leaves your photos, photo access, and subscription untouched."

support:
  title: Support
  subtitle: "No account, no ticket system. Send an email and you will get a reply."
  contact_title: Get in touch
  contact_body: "Email is the fastest way to reach us. Include your iOS version, your device, and what you expected to happen."
  response: "Expect a reply within a few days."
  before_title: Before you write
  before_body: "The in-app guide covers most of what people ask. Open Alike, go to Settings, then How to Use."
  bug_title: Reporting a bug
  bug_body: "Please describe what you did, what you expected, and what happened instead. Do not send photos from your library — we do not need them and would rather not receive them."
  privacy_title: Privacy questions
  privacy_body: "Alike has no server and collects nothing, so there is no account data to export or delete. The Privacy Policy explains this in full, and Delete Alike Data in Settings erases everything stored on your device."

