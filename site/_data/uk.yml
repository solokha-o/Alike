meta:
  title: "Alike — пошук візуально схожих фото на iPhone"
  description: "Alike знаходить і групує візуально схожі фотографії у вашій медіатеці за допомогою аналізу на пристрої, обирає найкращий знімок і допомагає прибрати решту. Без облікового запису, без сервера, нічого не залишає ваш iPhone."

