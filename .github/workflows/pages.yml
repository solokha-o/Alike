name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Assert no third-party requests
        run: |
          # The privacy policy states that Alike collects nothing and makes no
          # network requests of its own. A landing page that loaded an analytics
          # script, a CDN asset, or a web font would make that claim false, so
          # any external host is a build failure rather than a review comment.
          # Subdomains count: support.apple.com is Apple, www.sitemaps.org is
          # the sitemap namespace. XML/JSON-LD namespace URLs are identifiers,
          # not fetches, but they are allow-listed so the check stays quiet.
          hosts='solokha-o\.github\.io|apple\.com|w3\.org|schema\.org|sitemaps\.org'
          allowed="([a-z0-9-]+\.)*($hosts)"
          if grep -rhoE 'https?://[^"'"'"' )<>]+' ./_site \
              | sort -u \
              | grep -vE "^https?://($allowed)" > /tmp/external.txt \
              && [ -s /tmp/external.txt ]; then
            echo "::error::External hosts found in the built site:"
            cat /tmp/external.txt
            exit 1
          fi
          echo "No third-party hosts referenced."

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
